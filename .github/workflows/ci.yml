name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Unit tests
        run: npm test
      - name: Build single-file game
        run: npm run build
      - name: End-to-end tests (headless Chromium)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: stickman-fight-2d
          path: dist/index.html
