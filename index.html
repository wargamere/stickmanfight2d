<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07060d" />
<meta name="description" content="Stickman Fight 2D — a fast, deep, juicy stickman fighting game. 12 fighters, towers, survival, versus, training. Runs in your browser." />
<title>Stickman Fight 2D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@500;700&family=Russo+One&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07060d;
    --fg: #f4f1ff;
    --accent: #ffd23f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #07060d; --fg: #f4f1ff; }
  }
  :root[data-theme="dark"] { --bg: #07060d; --fg: #f4f1ff; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    cursor: default;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 22px "Russo One", system-ui, sans-serif;
    letter-spacing: 0.08em;
    color: var(--accent);
    pointer-events: none;
    transition: opacity 0.4s;
  }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 18px system-ui; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Stickman Fight 2D game canvas"></canvas>
<div id="boot">LOADING…</div>
<noscript>Stickman Fight 2D needs JavaScript enabled.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
